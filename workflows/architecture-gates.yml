name: architecture-gates

on:
  workflow_call:
    inputs:
      config:
        required: false
        type: string
        default: .governance.yml
      image:
        description: Immutable image containing this toolkit and the `governance` command.
        required: true
        type: string
      base:
        description: Full SHA of the reviewed base commit.
        required: true
        type: string
      head:
        description: Full SHA of the checked-out reviewed commit.
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      GOVERNANCE_IMAGE: ${{ inputs.image }}
      GOVERNANCE_BASE: ${{ inputs.base }}
      GOVERNANCE_HEAD: ${{ inputs.head }}
    steps:
      - name: Validate immutable workflow inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GOVERNANCE_IMAGE" =~ ^[^[:space:]]+@sha256:[0-9a-fA-F]{64}$ ]]; then
            echo 'FAIL image must be pinned with @sha256:<64 hex characters>' >&2
            exit 1
          fi
          if [[ ! "$GOVERNANCE_BASE" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'FAIL base must be a full 40-character commit SHA' >&2
            exit 1
          fi
          if [[ ! "$GOVERNANCE_HEAD" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'FAIL head must be a full 40-character commit SHA' >&2
            exit 1
          fi

  governance:
    needs: preflight
    runs-on: ubuntu-latest
    container: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head }}
          fetch-depth: 0
      - name: Provision the isolated TypeScript governance runtime
        shell: bash
        env:
          GOVERNANCE_TOOL_DIR: ${{ runner.temp }}/architecture-gates-typescript
        run: |
          set -euo pipefail
          test ! -e "$GOVERNANCE_TOOL_DIR"
          governance provision --tool typescript --target "$GOVERNANCE_TOOL_DIR"
          printf 'GOVERNANCE_TOOL_DIR=%s\n' "$GOVERNANCE_TOOL_DIR" >> "$GITHUB_ENV"
      - name: Verify the isolated TypeScript governance runtime
        shell: bash
        run: governance doctor --tool typescript
      - name: Run core governance gates with a fresh dependency scan
        env:
          GOVERNANCE_CONFIG: ${{ inputs.config }}
          GOVERNANCE_BASE: ${{ inputs.base }}
          GOVERNANCE_HEAD: ${{ inputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          governance check \
            --config "$GOVERNANCE_CONFIG" \
            --base "$GOVERNANCE_BASE" \
            --head "$GOVERNANCE_HEAD"
